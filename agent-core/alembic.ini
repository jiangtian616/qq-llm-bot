# For CLI use only (alembic reads this file with the locale encoding, keep it ASCII):
#   uv run alembic revision --autogenerate -m "..."   (targets ./.data/agent-core.db)
# At runtime agent_core/infra/db/migrate.py configures Alembic in code.
[alembic]
script_location = agent_core/infra/db/migrations
sqlalchemy.url = sqlite:///./.data/agent-core.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
