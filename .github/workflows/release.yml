# 三个平台并行构建便携版；推送 v* 标签时把产物发布到 GitHub Releases（草稿，确认后手动发布）。
# Flutter 和 Nuitka 都不能跨平台编译，每个平台在自己的系统上构建。
#
# 编译缓存只在 main 上保存：标签上存的缓存别的标签读不到，只有默认分支的缓存所有标签都能读。
# 所以核心服务的依赖或打包脚本在 main 上有改动时也构建一次，把缓存预热好，打标签时就能用上。
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - agent-core/uv.lock
      - packaging/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"
  # Windows runner 的控制台编码是 cp1252，打包脚本输出中文会抛 UnicodeEncodeError。
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-15
          # Intel 版 macOS 的 runner 标签变动较多，首次运行若找不到 runner，请按 GitHub 当前的标签调整。
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x86_64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # 不缓存 Flutter SDK：直接下载也就一分钟，而每个平台的缓存近 2 GB，会把仓库 10 GB 的缓存额度挤满，冲掉 Nuitka 的缓存。
          cache: false

      - uses: astral-sh/setup-uv@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ccache 给 Nuitka 缓存编译结果；macOS 上 Nuitka 会自己下载，Windows 用自带的 clcache。
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libsecret-1-dev patchelf libfuse2 ccache
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
          # runner 上没有 FUSE 内核模块，appimagetool 解包后运行。
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: uv sync --project agent-core --group build

      # Nuitka 的缓存目录里有两样东西：按字节码打包的模块（第三方包和标准库）的分析结果，按源码内容命中，
      # runner 镜像升级了编译器也不失效；我们自己的代码编译成 C 的结果（ccache / clcache）。
      # 取最近一次 main 上保存的缓存；保存时用 run_id 做键，每次都存一份新的，旧的由 GitHub 按 LRU 清掉。
      # 键名里的 v2 是缓存内容的版本：打包方式大改、旧缓存用不上时加一，免得每次都恢复一堆没用的文件。
      - name: Restore Nuitka cache
        uses: actions/cache/restore@v4
        with:
          path: &nuitka-cache |
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
            ~/.cache/Nuitka
          key: nuitka-v2-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: nuitka-v2-${{ matrix.name }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Package
        run: uv run --project agent-core --group build python packaging/package.py

      - name: Save Nuitka cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: *nuitka-cache
          key: nuitka-v2-${{ matrix.name }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: qq-llm-bot-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 用 runner 自带的 gh 发布：softprops/action-gh-release 并行上传时会中途退出，只传上一部分文件。
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 重跑时草稿已经存在，只补传文件。
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # 生成更新说明的接口偶尔返回 500；失败就先建空说明的草稿，发布前在网页上点「Generate release notes」补上。
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes \
              || gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" dist/* --clobber
